[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genppt-dynamic-tables"
version = "0.5.0"
description = "Template-driven dynamic PowerPoint table and image generation library"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0,<2.0",
    "Pillow>=10,<13",
    "fastapi>=0.143,<0.144",
    "starlette>=1.7,<1.8",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.32,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx2>=2,<3"]

[project.scripts]
genppt = "genppt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
